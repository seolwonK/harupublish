spring:
  datasource:
    url: jdbc:h2:mem:haru;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

haru:
  jwt:
    secret: "test-secret-key-with-at-least-thirty-two-bytes"
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14
  payments:
    lemon-squeezy:
      mock-paid-checkout-enabled: true
