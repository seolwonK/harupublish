spring:
  application:
    name: haru
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/haru?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci}
    username: ${SPRING_DATASOURCE_USERNAME:haru}
    password: ${SPRING_DATASOURCE_PASSWORD:haru}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${DB_CONNECTION_MAX_LIFETIME_MS:1800000}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/{vendor}

server:
  port: ${PORT:8080}
  # 리버스 프록시(Render 등) 뒤에서 X-Forwarded-* 헤더를 신뢰해
  # 업로드 URL(ServletUriComponentsBuilder)이 https/실제 도메인으로 생성되게 한다.
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,text/css,application/javascript
    min-response-size: 1024
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:80}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}

logging:
  level:
    root: INFO
    com.haru: ${LOGGING_LEVEL_COM_HARU:INFO}
    org.springframework.web: INFO
    org.springframework.security: INFO

    # SQL 쿼리 출력
    org.hibernate.SQL: ${LOGGING_LEVEL_HIBERNATE_SQL:WARN}

    # SQL 파라미터 출력, Spring Boot 3 / Hibernate 6 기준
    org.hibernate.orm.jdbc.bind: ${LOGGING_LEVEL_HIBERNATE_BIND:OFF}

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

haru:
  cors:
    allowed-origin-patterns: ${HARU_CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001,http://localhost:3002,http://127.0.0.1:3002}
  jwt:
    # Default is a development-only placeholder. In any non-local/test profile the
    # app MUST be started with HARU_JWT_SECRET set to a real 32+ byte secret; the
    # JwtTokenProvider fails fast on boot if the placeholder is used in prod (#7).
    secret: ${HARU_JWT_SECRET:change-this-local-development-secret-key-minimum-32-bytes}
    access-token-expiration-minutes: ${HARU_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:30}
    refresh-token-expiration-days: ${HARU_JWT_REFRESH_TOKEN_EXPIRATION_DAYS:14}
  payments:
    lemon-squeezy:
      enabled: ${LEMON_SQUEEZY_ENABLED:false}
      api-key: ${LEMON_SQUEEZY_API_KEY:}
      # store-id: when set, incoming webhooks whose data.attributes.store_id differs
      # are rejected (#8b cross-store / forged-event guard).
      store-id: ${LEMON_SQUEEZY_STORE_ID:}
      variant-id: ${LEMON_SQUEEZY_VARIANT_ID:}
      # signing-secret: HMAC-SHA256 secret used to verify the X-Signature header on
      # every webhook (#8a). Webhooks are rejected if this is unset or the signature
      # does not match (constant-time compare).
      signing-secret: ${LEMON_SQUEEZY_SIGNING_SECRET:}
      redirect-url: ${LEMON_SQUEEZY_REDIRECT_URL:http://localhost:3000/payments}
      test-mode: ${LEMON_SQUEEZY_TEST_MODE:true}
      custom-price-exchange-rate: ${LEMON_SQUEEZY_CUSTOM_PRICE_EXCHANGE_RATE:1}
  jitsi:
    jaas:
      enabled: ${JITSI_JAAS_ENABLED:false}
      app-id: ${JITSI_JAAS_APP_ID:}
      key-id: ${JITSI_JAAS_KEY_ID:}
      private-key-pem: ${JITSI_JAAS_PRIVATE_KEY_PEM:}
      domain: ${JITSI_JAAS_DOMAIN:8x8.vc}
      token-ttl-minutes: ${JITSI_JAAS_TOKEN_TTL_MINUTES:120}
