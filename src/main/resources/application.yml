spring:
  application:
    name: haru
  datasource:
    url: jdbc:mysql://localhost:3306/haru?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: haru
    password: haru
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

haru:
  jwt:
    secret: "change-this-local-development-secret-key-minimum-32-bytes"
    access-token-expiration-minutes: 30
    refresh-token-expiration-days: 14
