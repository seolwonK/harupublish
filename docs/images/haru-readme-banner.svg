<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Haru Backend</title>
  <desc id="desc">Animated banner for the Haru backend README</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#101418"/>
      <stop offset="0.48" stop-color="#17211D"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#31C48D" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#31C48D"/>
      <stop offset="0.7" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#60A5FA" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>

  <g opacity="0.26">
    <path d="M100 80H1180" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M100 140H1180" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M100 200H1180" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M100 260H1180" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <path d="M180 42V318" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M420 42V318" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M660 42V318" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M900 42V318" stroke="#FFFFFF" stroke-opacity="0.08"/>
    <path d="M1140 42V318" stroke="#FFFFFF" stroke-opacity="0.08"/>
  </g>

  <circle cx="1064" cy="96" r="72" fill="#31C48D" opacity="0.12" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="4.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="224" cy="262" r="64" fill="#60A5FA" opacity="0.1" filter="url(#softGlow)">
    <animate attributeName="opacity" values="0.06;0.16;0.06" dur="5.6s" repeatCount="indefinite"/>
  </circle>

  <g transform="translate(106 76)">
    <rect x="0" y="0" width="238" height="48" rx="12" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <circle cx="28" cy="24" r="8" fill="#31C48D"/>
    <text x="48" y="30" fill="#D1FAE5" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Backend Online</text>
  </g>

  <text x="106" y="174" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="0">Haru Backend</text>
  <text x="110" y="224" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">JWT auth, tutor workflow, approval review, and Dockerized MySQL runtime</text>

  <g transform="translate(110 264)" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="0" y="0" width="112" height="38" rx="10" fill="#31C48D" fill-opacity="0.14" stroke="#31C48D" stroke-opacity="0.45"/>
    <text x="22" y="25" fill="#A7F3D0">Java 21</text>

    <rect x="128" y="0" width="154" height="38" rx="10" fill="#60A5FA" fill-opacity="0.14" stroke="#60A5FA" stroke-opacity="0.45"/>
    <text x="150" y="25" fill="#BFDBFE">Spring Boot</text>

    <rect x="298" y="0" width="116" height="38" rx="10" fill="#F59E0B" fill-opacity="0.14" stroke="#F59E0B" stroke-opacity="0.45"/>
    <text x="320" y="25" fill="#FDE68A">Flyway</text>

    <rect x="430" y="0" width="122" height="38" rx="10" fill="#22D3EE" fill-opacity="0.14" stroke="#22D3EE" stroke-opacity="0.45"/>
    <text x="452" y="25" fill="#A5F3FC">Docker</text>
  </g>

  <g opacity="0.92">
    <path d="M700 286C788 226 846 226 934 286C1004 334 1064 334 1142 286" stroke="url(#line)" stroke-width="5" stroke-linecap="round" stroke-dasharray="26 18">
      <animate attributeName="stroke-dashoffset" from="0" to="-88" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <circle cx="700" cy="286" r="8" fill="#31C48D"/>
    <circle cx="934" cy="286" r="8" fill="#60A5FA"/>
    <circle cx="1142" cy="286" r="8" fill="#31C48D"/>
  </g>
</svg>
