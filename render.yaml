services:
  - type: web
    name: haru-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: .
    healthCheckPath: /swagger-ui.html
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/migration/{vendor}
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - key: HARU_JWT_SECRET
        generateValue: true