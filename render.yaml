services:
  - type: web
    name: haru-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    rootDir: .
    healthCheckPath: /swagger-ui.html
    autoDeploy: true
    # 업로드(튜터 이미지, 채팅 첨부) 영속화 — 디스크 없이는 재배포마다 파일이 소실된다.
    # 주의: 디스크가 붙은 서비스는 zero-downtime 배포가 비활성화된다(재시작 배포).
    disk:
      name: haru-uploads
      mountPath: /app/uploads
      sizeGB: 1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: SPRING_FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/migration/{vendor}
      - key: JAVA_TOOL_OPTIONS
        value: -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - key: HARU_JWT_SECRET
        generateValue: true
      # 테스트 MVP 배포용 개발자 도구(/api/dev/**) 활성화. 실서비스 전환 시 false로 변경/삭제할 것.
      - key: HARU_DEV_TOOLS_ENABLED
        value: "true"